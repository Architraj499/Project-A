<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asprients Firebase Write Load Test</title>

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .warning {
      padding: 15px;
      margin: 20px 0;
      border-radius: 10px;
      background: #422006;
      border: 1px solid #92400e;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 25px 0;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #output {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 20px;
      min-height: 350px;
      white-space: pre-wrap;
      font-family: Consolas, monospace;
      line-height: 1.6;
      overflow-x: auto;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Asprients Firebase Write Load Test</h1>

  <p>
    Test 3B — Firestore concurrent write test
  </p>

  <div class="warning">
    ⚠️ TEMPORARY TEST DATA ONLY<br>
    This test writes documents only inside:
    <code>loadTest/</code>
    <br><br>
    The test automatically deletes the documents after each run.
  </div>

  <div class="controls">

    <button id="test10">
      Test 10
    </button>

    <button id="test25">
      Test 25
    </button>

    <button id="test50">
      Test 50
    </button>

    <button id="test100">
      Test 100
    </button>

  </div>

  <div id="status">
    Status: Ready
  </div>

  <pre id="output">Waiting for test...</pre>

</div>


<script type="module">

  // ============================================================
  // Firebase
  // ============================================================

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    doc,
    setDoc,
    deleteDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";


  // ============================================================
  // Firebase config
  // ============================================================

  const firebaseConfig = {

    apiKey:
      "AIzaSyDHRDRRm2KBmCuUf3qvTIRI5hO0aXFFx3w",

    authDomain:
      "asprients-95c1f.firebaseapp.com",

    projectId:
      "asprients-95c1f",

    storageBucket:
      "asprients-95c1f.appspot.com",

    messagingSenderId:
      "453218332819",

    appId:
      "1:453218332819:web:5740173fa4d8156dae9d66"

  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  // ============================================================
  // DOM
  // ============================================================

  const output =
    document.getElementById("output");

  const status =
    document.getElementById("status");

  const buttons = [
    document.getElementById("test10"),
    document.getElementById("test25"),
    document.getElementById("test50"),
    document.getElementById("test100")
  ];


  function log(message = "") {

    output.textContent +=
      message + "\n";

  }


  function setStatus(message) {

    status.textContent =
      "Status: " + message;

  }


  function disableButtons(value) {

    buttons.forEach(
      button =>
        button.disabled = value
    );

  }


  // ============================================================
  // Authentication
  // ============================================================

  async function login() {

    const email =
      prompt(
        "Enter TEST ACCOUNT email:"
      );

    if (!email) {

      throw new Error(
        "Email not provided."
      );

    }


    const password =
      prompt(
        "Enter TEST ACCOUNT password:"
      );

    if (!password) {

      throw new Error(
        "Password not provided."
      );

    }


    const credential =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    return credential.user;

  }


  // ============================================================
  // Single write
  // ============================================================

  async function performWrite(
    testRunId,
    userNumber
  ) {

    const documentId =
      testRunId +
      "_user_" +
      userNumber;

    const reference =
      doc(
        collection(
          db,
          "loadTest"
        ),
        documentId
      );


    const start =
      performance.now();


    try {

      await setDoc(
        reference,
        {
          testRun:
            testRunId,

          simulatedUser:
            userNumber,

          createdAt:
            serverTimestamp(),

          test:
            "Asprients Firebase Write Load Test"
        }
      );


      return {

        success: true,

        elapsed:
          performance.now() -
          start,

        reference

      };

    } catch (error) {

      return {

        success: false,

        elapsed:
          performance.now() -
          start,

        error:
          error.code ||
          error.message,

        reference

      };

    }

  }


  // ============================================================
  // Cleanup
  // ============================================================

  async function cleanup(results) {

    const documents =
      results.filter(
        result =>
          result.reference
      );


    if (!documents.length) {

      return;

    }


    log("");
    log(
      "Cleaning temporary documents..."
    );


    const cleanupResults =
      await Promise.all(

        documents.map(
          async result => {

            try {

              await deleteDoc(
                result.reference
              );

              return true;

            } catch {

              return false;

            }

          }
        )

      );


    const deleted =
      cleanupResults.filter(
        Boolean
      ).length;


    log(
      "Deleted: " +
      deleted +
      "/" +
      documents.length
    );

  }


  // ============================================================
  // Main test
  // ============================================================

  async function runTest(
    concurrentUsers
  ) {

    disableButtons(true);

    output.textContent = "";

    setStatus(
      "Running " +
      concurrentUsers +
      " concurrent writes..."
    );


    log(
      "============================================================"
    );

    log(
      "ASPRIENTS FIREBASE WRITE LOAD TEST"
    );

    log(
      "============================================================"
    );

    log("");

    log(
      "Concurrent writes: " +
      concurrentUsers
    );

    log(
      "Target collection: loadTest/"
    );

    log(
      "Mode: WRITE + AUTOMATIC CLEANUP"
    );

    log("");


    let results = [];


    try {

      // --------------------------------------------------------
      // Login
      // --------------------------------------------------------

      log(
        "Signing in..."
      );


      const user =
        await login();


      log(
        "Authentication: SUCCESS"
      );

      log(
        "UID: " +
        user.uid
      );

      log("");


      // --------------------------------------------------------
      // Unique test ID
      // --------------------------------------------------------

      const testRunId =
        "run_" +
        Date.now();


      log(
        "Test ID: " +
        testRunId
      );

      log("");


      // --------------------------------------------------------
      // Concurrent writes
      // --------------------------------------------------------

      log(
        "Starting concurrent writes..."
      );

      log("");


      const start =
        performance.now();


      const tasks = [];


      for (
        let i = 1;
        i <= concurrentUsers;
        i++
      ) {

        tasks.push(
          performWrite(
            testRunId,
            i
          )
        );

      }


      results =
        await Promise.all(
          tasks
        );


      const totalTime =
        performance.now() -
        start;


      // --------------------------------------------------------
      // Statistics
      // --------------------------------------------------------

      const successful =
        results.filter(
          result =>
            result.success
        ).length;


      const failed =
        results.length -
        successful;


      const times =
        results.map(
          result =>
            result.elapsed
        );


      const average =
        times.reduce(
          (sum, value) =>
            sum + value,
          0
        ) / times.length;


      const minimum =
        Math.min(...times);


      const maximum =
        Math.max(...times);


      const sorted =
        [...times].sort(
          (a, b) =>
            a - b
        );


      const p95Index =
        Math.min(
          sorted.length - 1,
          Math.ceil(
            sorted.length * 0.95
          ) - 1
        );


      const p95 =
        sorted[p95Index];


      const errors = {};


      results.forEach(
        result => {

          if (result.error) {

            errors[result.error] =
              (
                errors[result.error] ||
                0
              ) + 1;

          }

        }
      );


      // --------------------------------------------------------
      // Results
      // --------------------------------------------------------

      log(
        "RESULTS"
      );

      log(
        "------------------------------------------------------------"
      );

      log(
        "Requests       : " +
        results.length
      );

      log(
        "Successful     : " +
        successful
      );

      log(
        "Failed         : " +
        failed
      );

      log(
        "Success rate   : " +
        (
          successful /
          results.length *
          100
        ).toFixed(2) +
        "%"
      );

      log("");

      log(
        "Average        : " +
        average.toFixed(2) +
        " ms"
      );

      log(
        "Minimum        : " +
        minimum.toFixed(2) +
        " ms"
      );

      log(
        "Maximum        : " +
        maximum.toFixed(2) +
        " ms"
      );

      log(
        "P95            : " +
        p95.toFixed(2) +
        " ms"
      );

      log(
        "Total test     : " +
        totalTime.toFixed(2) +
        " ms"
      );


      if (
        Object.keys(errors).length
      ) {

        log("");

        log(
          "ERRORS:"
        );

        Object.entries(
          errors
        ).forEach(
          ([error, count]) => {

            log(
              error +
              " × " +
              count
            );

          }
        );

      }


      // --------------------------------------------------------
      // Cleanup
      // --------------------------------------------------------

      await cleanup(
        results
      );


      log("");

      if (
        failed === 0
      ) {

        log(
          "🟢 TEST PASSED"
        );

      } else {

        log(
          "🔴 TEST HAD FAILURES"
        );

      }


      setStatus(
        "Test completed."
      );


    } catch (error) {

      log("");

      log(
        "❌ TEST ERROR"
      );

      log(
        error.code ||
        error.message
      );


      // Try to clean up if some writes
      // succeeded before an unexpected error.

      if (results.length) {

        await cleanup(
          results
        );

      }


      setStatus(
        "Test failed."
      );

    }


    disableButtons(false);

  }


  // ============================================================
  // Buttons
  // ============================================================

  document
    .getElementById("test10")
    .addEventListener(
      "click",
      () => runTest(10)
    );


  document
    .getElementById("test25")
    .addEventListener(
      "click",
      () => runTest(25)
    );


  document
    .getElementById("test50")
    .addEventListener(
      "click",
      () => runTest(50)
    );


  document
    .getElementById("test100")
    .addEventListener(
      "click",
      () => runTest(100)
    );


  setStatus(
    "Ready — start with Test 10."
  );

</script>

</body>
</html>
