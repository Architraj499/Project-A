<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asprients • Under Maintenance</title>

<link rel="icon" href="images/logo1.png" type="image/png">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,Segoe UI,sans-serif;
    background:linear-gradient(135deg,#081b33,#102d5f,#1769aa);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

/* Background Glow */

body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:#00d9ff33;
    border-radius:50%;
    filter:blur(120px);
    top:-150px;
    right:-150px;
}

body::after{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    background:#6b21a833;
    border-radius:50%;
    filter:blur(100px);
    bottom:-120px;
    left:-120px;
}

.container{
    position:relative;
    z-index:2;
    width:90%;
    max-width:650px;
    text-align:center;
    padding:45px;
    border-radius:25px;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.12);
}

.logo{
    width:90px;
    margin-bottom:20px;
    border-radius:50%;
}

.badge{

    display:inline-block;
    background:#ff9800;
    color:#fff;
    padding:8px 18px;
    border-radius:40px;
    font-weight:700;
    margin-bottom:20px;
    letter-spacing:.5px;
}

h1{

    font-size:46px;
    margin-bottom:15px;
}

p{

    color:#d6e7ff;
    font-size:18px;
    line-height:1.8;
}

.loader{

    width:65px;
    height:65px;
    border:6px solid rgba(255,255,255,.15);
    border-top:6px solid white;
    border-radius:50%;
    margin:40px auto;
    animation:spin 1s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

.status{

    margin-top:10px;
    font-size:15px;
    color:#9ee7ff;
}

.footer{

    margin-top:35px;
    font-size:14px;
    color:#b8d8ff;
}

.footer a{

    color:white;
    text-decoration:none;
    font-weight:600;
}

.footer a:hover{

    text-decoration:underline;
}

@media(max-width:700px){

    h1{
        font-size:34px;
    }

    p{
        font-size:16px;
    }

    .container{
        padding:35px 25px;
    }

}
.container{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

    <img src="images/logo.png" class="logo" alt="Asprients">

    <div class="badge">
        🚧 Scheduled Maintenance
    </div>

    <h1>We'll Be Back Soon</h1>

    <p>
        Asprients is currently undergoing maintenance to improve performance,
        add new features, and provide a better learning experience.
    </p>

    <div class="loader"></div>

    <div class="status">
        Estimated Downtime: <strong>30–60 Minutes</strong>
    </div>

    <div class="footer">
        Thank you for your patience ❤️
        <br><br>
        © 2026 Asprients
    </div>

</div>
<script>
async function checkMaintenance() {
    try {
        const response = await fetch("maintenance.json?t=" + Date.now());

        if (!response.ok) return;

        const data = await response.json();

        if (data.maintenance === false) {
            window.location.replace("index.html");
        }

    } catch (err) {
        console.log("Maintenance check failed");
    }
}

// Check immediately
checkMaintenance();

// Then check every 5 seconds
setInterval(checkMaintenance, 5000);
</script>
</body>
</html>
