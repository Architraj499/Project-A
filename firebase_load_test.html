<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Asprients Firebase Load Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin-bottom: 10px;
    }

    .warning {
      padding: 15px;
      margin: 20px 0;
      border-radius: 10px;
      background: #422006;
      border: 1px solid #92400e;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 25px 0;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #output {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 20px;
      min-height: 300px;
      white-space: pre-wrap;
      font-family: Consolas, monospace;
      line-height: 1.6;
      overflow-x: auto;
    }

    .status {
      margin-bottom: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Asprients Firebase Load Test</h1>

  <p>
    Test 3A — Firestore read-load test
  </p>

  <div class="warning">
    ⚠️ READ-ONLY TEST<br>
    This test only reads the authenticated test user's
    <code>users/{uid}</code> document.
    It does not create, update, or delete data.
  </div>

  <div class="controls">

    <button id="test10">
      Test 10
    </button>

    <button id="test25">
      Test 25
    </button>

    <button id="test50">
      Test 50
    </button>

    <button id="test100">
      Test 100
    </button>

  </div>

  <div class="status" id="status">
    Status: Ready
  </div>

  <pre id="output">Waiting for test...</pre>

</div>


<script type="module">

  // ============================================================
  // Firebase imports
  // ============================================================

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";


  import {
    getAuth,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";


  import {
    getFirestore,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";


  // ============================================================
  // Firebase configuration
  // ============================================================

  const firebaseConfig = {

    apiKey:
      "AIzaSyDHRDRRm2KBmCuUf3qvTIRI5hO0aXFFx3w",

    authDomain:
      "asprients-95c1f.firebaseapp.com",

    projectId:
      "asprients-95c1f",

    storageBucket:
      "asprients-95c1f.appspot.com",

    messagingSenderId:
      "453218332819",

    appId:
      "1:453218332819:web:5740173fa4d8156dae9d66"

  };


  // ============================================================
  // Initialize Firebase
  // ============================================================

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  // ============================================================
  // DOM
  // ============================================================

  const output =
    document.getElementById("output");

  const status =
    document.getElementById("status");


  const buttons = [
    document.getElementById("test10"),
    document.getElementById("test25"),
    document.getElementById("test50"),
    document.getElementById("test100")
  ];


  // ============================================================
  // Logging
  // ============================================================

  function log(message = "") {

    output.textContent +=
      message + "\n";

  }


  function setStatus(message) {

    status.textContent =
      "Status: " + message;

  }


  function setButtonsDisabled(disabled) {

    buttons.forEach(button => {

      button.disabled =
        disabled;

    });

  }


  // ============================================================
  // Login
  // ============================================================

  async function login() {

    const email =
      prompt(
        "Enter TEST ACCOUNT email:"
      );

    if (!email) {

      throw new Error(
        "Email not provided."
      );

    }


    const password =
      prompt(
        "Enter TEST ACCOUNT password:"
      );

    if (!password) {

      throw new Error(
        "Password not provided."
      );

    }


    log("Signing in...");


    const credential =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    return credential.user;

  }


  // ============================================================
  // Single Firestore read
  // ============================================================

  async function performRead(userRef) {

    const start =
      performance.now();


    try {

      const snapshot =
        await getDoc(userRef);


      const elapsed =
        performance.now() -
        start;


      return {

        success:
          snapshot.exists(),

        elapsed,

        error:
          null

      };

    } catch (error) {

      const elapsed =
        performance.now() -
        start;


      return {

        success:
          false,

        elapsed,

        error:
          error.code ||
          error.message

      };

    }

  }


  // ============================================================
  // Main load test
  // ============================================================

  async function runTest(concurrentUsers) {

    setButtonsDisabled(true);

    output.textContent = "";

    setStatus(
      "Starting " +
      concurrentUsers +
      " concurrent reads..."
    );


    log(
      "============================================================"
    );

    log(
      "ASPRIENTS FIREBASE LOAD TEST"
    );

    log(
      "============================================================"
    );

    log("");

    log(
      "Concurrent reads: " +
      concurrentUsers
    );

    log(
      "Operation: Firestore getDoc()"
    );

    log(
      "Mode: READ ONLY"
    );

    log("");


    try {

      // --------------------------------------------------------
      // Authenticate
      // --------------------------------------------------------

      const user =
        await login();


      log(
        "Authentication: SUCCESS"
      );

      log(
        "UID: " +
        user.uid
      );

      log("");


      // --------------------------------------------------------
      // Reference
      // --------------------------------------------------------

      const userRef =
        doc(
          db,
          "users",
          user.uid
        );


      log(
        "Target:"
      );

      log(
        "users/" +
        user.uid
      );

      log("");


      // --------------------------------------------------------
      // Test
      // --------------------------------------------------------

      log(
        "Starting concurrent reads..."
      );

      log("");


      const testStart =
        performance.now();


      const tasks = [];


      for (
        let i = 0;
        i < concurrentUsers;
        i++
      ) {

        tasks.push(
          performRead(userRef)
        );

      }


      const results =
        await Promise.all(tasks);


      const totalTime =
        performance.now() -
        testStart;


      // --------------------------------------------------------
      // Statistics
      // --------------------------------------------------------

      const successful =
        results.filter(
          result =>
            result.success
        ).length;


      const failed =
        results.length -
        successful;


      const times =
        results.map(
          result =>
            result.elapsed
        );


      const average =
        times.reduce(
          (sum, value) =>
            sum + value,
          0
        ) / times.length;


      const minimum =
        Math.min(...times);


      const maximum =
        Math.max(...times);


      const sorted =
        [...times].sort(
          (a, b) =>
            a - b
        );


      const p95Index =
        Math.min(
          sorted.length - 1,
          Math.ceil(
            sorted.length * 0.95
          ) - 1
        );


      const p95 =
        sorted[p95Index];


      const errorCounts = {};


      results.forEach(result => {

        if (result.error) {

          errorCounts[result.error] =
            (errorCounts[result.error] || 0) + 1;

        }

      });


      // --------------------------------------------------------
      // Report
      // --------------------------------------------------------

      log(
        "RESULTS"
      );

      log(
        "------------------------------------------------------------"
      );

      log(
        "Requests       : " +
        results.length
      );

      log(
        "Successful     : " +
        successful
      );

      log(
        "Failed         : " +
        failed
      );

      log(
        "Success rate   : " +
        (
          successful /
          results.length *
          100
        ).toFixed(2) +
        "%"
      );

      log("");

      log(
        "Average        : " +
        average.toFixed(2) +
        " ms"
      );

      log(
        "Minimum        : " +
        minimum.toFixed(2) +
        " ms"
      );

      log(
        "Maximum        : " +
        maximum.toFixed(2) +
        " ms"
      );

      log(
        "P95            : " +
        p95.toFixed(2) +
        " ms"
      );

      log(
        "Total test     : " +
        totalTime.toFixed(2) +
        " ms"
      );


      if (
        Object.keys(errorCounts).length > 0
      ) {

        log("");

        log(
          "ERRORS:"
        );

        Object.entries(
          errorCounts
        ).forEach(
          ([error, count]) => {

            log(
              error +
              " × " +
              count
            );

          }
        );

      }


      log("");

      if (
        failed === 0
      ) {

        log(
          "🟢 TEST PASSED"
        );

      } else {

        log(
          "🔴 TEST HAD FAILURES"
        );

      }


      setStatus(
        "Test completed."
      );


    } catch (error) {

      log("");

      log(
        "❌ TEST ERROR"
      );

      log(
        error.code ||
        error.message
      );


      setStatus(
        "Test failed."
      );

    }


    setButtonsDisabled(false);

  }


  // ============================================================
  // Button handlers
  // ============================================================

  document
    .getElementById("test10")
    .addEventListener(
      "click",
      () => runTest(10)
    );


  document
    .getElementById("test25")
    .addEventListener(
      "click",
      () => runTest(25)
    );


  document
    .getElementById("test50")
    .addEventListener(
      "click",
      () => runTest(50)
    );


  document
    .getElementById("test100")
    .addEventListener(
      "click",
      () => runTest(100)
    );


  // ============================================================
  // Ready
  // ============================================================

  setStatus(
    "Ready — select a test."
  );

</script>

</body>
</html>
